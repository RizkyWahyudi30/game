<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Section: Judul -->
    <div class="header">
      <header class="title">
        <h1>Game Tic Tac Toe</h1>
        <p>
          permainan papan kertas klasik untuk dua pemain yang menggunakan kotak
          berukuran 3×3
        </p>
      </header>
    </div>

    <!-- Section: Gameplay -->
    <div class="gameplay">
      <!-- button reset -->
      <button id="reset-arena">Reset arena</button>

      <!-- Papan game -->
      <div id="kotak-game"></div>

      <!-- info game: giliran dan timer -->
      <div class="info-game">
        <!-- giliran pemain -->
        <p>Giliran: <span id="antrian-pemain"></span></p>

        <!-- atur waktu -->
        <div class="waktu">
          <label for="opsi-waktu">Durasi game:</label>
          <select id="opsi-waktu">
            <option value="20" selected>20 detik</option>
            <option value="15">15 detik</option>
            <option value="10">10 detik</option>
          </select>

          <!-- sisa waktu -->
          <p>Sisa waktu: <span id="sisa-waktu"></span></p>
        </div>
      </div>

      <button id="button-mulai">Mulai Game</button>

      <!-- hitung round ke berapa -->
      <p>Ronde Game: <span id="ronde"></span></p>
      <button id="reset-total">Reset Total</button>
    </div>

    <!-- Section: History -->
    <div class="history-game">
      <h3>History Game</h3>
      <div id="history-container"></div>
    </div>

    <script src="main.js" type="module"></script>
    <!-- analytics vercel -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
